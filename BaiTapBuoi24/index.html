<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FakeStore</title>

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<header class="header">
  <div class="logo">🛒 FakeStore</div>
  <div class="search-box"><input id="searchInput" type="text" placeholder="Tìm kiếm sản phẩm..."/></div>
  <div class="cart">
    🛒
    <span id="cartCount">0</span>
  </div>
</header>

<main class="main">
  <aside class="sidebar">
    <h3>Danh mục</h3>
    <ul id="categoryList">
      <li class="active" data-category="all">Tất cả sản phẩm</li>
    </ul>
  </aside>

  <section class="products-section">
    <h1>Tất cả sản phẩm</h1>
    <p id="productCount">Đang tải sản phẩm...</p>
    <div id="productList" class="product-grid"></div>
  </section>
</main>

<script src="./index.js"></script>
</body>
</html>
